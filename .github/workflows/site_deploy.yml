name: Publish Web Page
on:
  push:
    branches:
      - main
    # 只对影响站点构建的路径触发重建；README/AGENTS/CLAUDE/.github 非 workflow 等无关改动跳过
    paths:
      - 'config/**'
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'i18n/**'
      - 'archetypes/**'
      - 'themes/**'              # submodule 指针变化也触发
      - 'deploy'
      - '.github/workflows/**'   # workflow 自身变更触发（便于验证）
  workflow_dispatch:             # 手动触发入口

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true       # 最新 push 覆盖旧 run，避免并发竞争 gh-pages 分支

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v6
      with:
        submodules: true
        fetch-depth: 0            # deploy 发布 + enableGitInfo 需要完整历史
        persist-credentials: true # deploy 脚本需要推送 gh-pages 的凭据
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.165.0'
        extended: true
    - name: Cache Hugo resources
      uses: actions/cache@v5
      with:
        path: |
          resources/_gen
          ~/.cache/hugo_cache
        key: ${{ runner.os }}-hugo-${{ hashFiles('config/**', 'assets/**', 'themes/**', 'content/**') }}
        restore-keys: |
          ${{ runner.os }}-hugo-
    - name: Content checks
      run: python3 scripts/check_content.py
    - name: Build and publish website
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        ./deploy

    - name: Submit URLs to IndexNow
      continue-on-error: true
      run: |
        set -euo pipefail
        KEY_FILE=$(ls static/*.txt | head -n1)
        KEY=$(basename "$KEY_FILE" .txt)
        python3 - "$KEY" <<'PY'
        import json, re, sys, time, urllib.request

        key = sys.argv[1]
        host = "https://orzmc.jokerhub.cn"

        # 等 Pages 把 key 文件发布出去（IndexNow 会回源校验），最多等 2 分钟
        for attempt in range(8):
            try:
                body = urllib.request.urlopen(f"{host}/{key}.txt?ts={int(time.time())}", timeout=15).read().decode().strip()
                if body == key:
                    break
            except Exception:
                pass
            time.sleep(15)
        else:
            print("IndexNow: key file not reachable yet, skip")
            sys.exit(0)

        sitemap = urllib.request.urlopen(f"{host}/sitemap.xml?ts={int(time.time())}", timeout=30).read().decode()
        urls = re.findall(r"<loc>(.*?)</loc>", sitemap)
        payload = {
            "host": host,
            "key": key,
            "keyLocation": f"{host}/{key}.txt",
            "urlList": urls,
        }
        req = urllib.request.Request(
            "https://api.indexnow.org/indexnow",
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json; charset=utf-8"},
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=30) as resp:
            print(f"IndexNow: submitted {len(urls)} URLs, HTTP {resp.status}")
        PY
