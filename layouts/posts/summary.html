{{ $show_date := partials.Include "func/ShowDate.html" . }}
<div class="w-100 mb4 nested-copy-line-height relative bg-white flex flex-column">
  <div class="mb3 pa4 gray overflow-hidden bg-white flex flex-column">
    {{with .CurrentSection.Title }}<span class="f6 db">{{ . }}</span>{{end}}
    {{ if $show_date }}
      <time class="f6 db" {{ fmt.Printf `datetime="%s"` (.Date.Format "2006-01-02T15:04:05Z07:00") | safe.HTMLAttr }}>
        {{- .Date | time.Format (compare.Default "January 2, 2006" .Site.Params.date_format) -}}
      </time>
    {{ end }}
    <h2 class="f3 near-black">
      <a href="{{ .RelPermalink }}" class="link black dim">
        {{ .Title }}
      </a>
    </h2>
    <div class="nested-links f5 lh-copy nested-copy-line-height flex-grow-1">
      {{ .Summary }}
    </div>
  </div>
</div>
