<script>
(function(){
  var d=document.documentElement;
  var key='theme';
  var preferred=function(){
    /* 与 DOMContentLoaded 里的初始主题逻辑保持一致，避免首屏 dark→light 闪烁：
       无存档时站点默认暗黑模式（不再随系统偏好；用户手动切换后以 localStorage 为准） */
    return 'dark';
  };
  var saved;
  try{ saved=localStorage.getItem(key); }catch(_){}
  d.setAttribute('data-theme',saved||preferred());
  /* theme-color 随主题：暗 #0f172a / 亮 #f4f4f4（head 里静态 meta 作首屏默认） */
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta){ meta.setAttribute('content', d.getAttribute('data-theme')==='dark' ? '#0f172a' : '#f4f4f4'); }
})();
document.addEventListener('DOMContentLoaded',function(){
  var applyTheme=function(theme){
    document.documentElement.setAttribute('data-theme',theme);
    var meta=document.querySelector('meta[name="theme-color"]');
    if(meta){ meta.setAttribute('content', theme==='dark' ? '#0f172a' : '#f4f4f4'); }
    var btn=document.getElementById('theme-toggle');
    if(btn){
      var label=btn.querySelector('.theme-toggle__label');
      if(label){
        label.textContent=theme==='dark'?'白天':'夜间';
      }else{
        btn.textContent=theme==='dark'?'白天':'夜间';
      }
      btn.setAttribute('aria-label',theme==='dark'?'切换到白天模式':'切换到夜间模式');
      btn.setAttribute('aria-pressed',theme==='dark'?'true':'false');
    }
  };
  var stored;
  try{ stored=localStorage.getItem('theme'); }catch(_){}
  if(stored){ applyTheme(stored); }
  else{
    applyTheme('dark'); /* 无存档 → 默认暗黑 */
  }
  var toggle=document.getElementById('theme-toggle');
  if(toggle){
    toggle.addEventListener('click',function(){
      var current=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
      var next=current==='dark'?'light':'dark';
      applyTheme(next);
      try{ localStorage.setItem('theme',next); }catch(_){}
    });
  }
  var links=document.querySelectorAll('.anchor-link');
  links.forEach(function(a){
    a.addEventListener('click',function(e){
      e.preventDefault();
      var hash=a.getAttribute('href')||'';
      var url=location.origin+location.pathname+location.search+hash;
      try{ history.replaceState(null,'',url); }catch(_){}
      var revert=function(){ try{ a.setAttribute('data-tooltip','点击复制链接'); }catch(_){} };
      var copied=function(){ try{ a.setAttribute('data-tooltip','已复制'); setTimeout(revert,1500); }catch(_){} };
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(copied).catch(revert); }
      else{
        try{
          var i=document.createElement('input');
          i.style.position='fixed';
          i.style.opacity='0';
          i.value=url;
          document.body.appendChild(i);
          i.select();
          document.execCommand('copy');
          document.body.removeChild(i);
          copied();
        }catch(_){ revert(); }
      }
    });
  });
});
</script>

<script>
/* 代码块一键复制：主题 layouts/_markup/render-codeblock.html 会输出隐藏的复制按钮
   （标记了 hidden），并把启用逻辑放在主题的 site-scripts.html 里；本站在项目层
   覆盖了该 partial，因此在这里补齐「显示按钮 + 点击复制」逻辑。 */
(function () {
  "use strict";
  function revealButtons() {
    var buttons = document.querySelectorAll(".code-block .code-copy[hidden]");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].hidden = false;
      var label = buttons[i].querySelector(".code-copy-label");
      if (label) label.textContent = "复制";
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", revealButtons);
  } else {
    revealButtons();
  }
  function flash(button) {
    var label = button.querySelector(".code-copy-label");
    button.classList.add("is-copied");
    if (label) label.textContent = "已复制";
    window.setTimeout(function () {
      button.classList.remove("is-copied");
      if (label) label.textContent = "复制";
    }, 2000);
  }
  function legacyCopy(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "absolute";
    area.style.left = "-9999px";
    document.body.appendChild(area);
    area.select();
    var ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(area);
    return ok;
  }
  function copyFrom(button) {
    var container = button.closest(".code-block");
    if (!container) return;
    var pre = container.querySelector("pre");
    if (!pre) return;
    var source = pre.querySelector("code") || pre;
    var text = source.innerText;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { flash(button); },
        function () { if (legacyCopy(text)) flash(button); }
      );
    } else if (legacyCopy(text)) {
      flash(button);
    }
  }
  document.addEventListener("click", function (event) {
    var button = event.target.closest(".code-copy");
    if (button) copyFrom(button);
  });
})();
</script>
