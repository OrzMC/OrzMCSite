[ananke.hooks]
verbosity = "error"

# 服务器实时状态组件（通用可嵌入：任意 markdown 里用 {{< server-status >}}）
# 说明：地址会写入页面配置 JSON 供浏览器查询状态 API；
# show_address 控制地址是否在卡片上显示（缺省 false；可被单台服务器覆盖）：
#   false：地址彻底隐藏——不渲染任何地址胶囊（无掩码/复制/眼睛），适合私密服；
#   true：显示地址胶囊（掩码 + 眼睛切换 + 复制按钮）。明文只在 JS 运行时解码，构建产物仍无明文。
[server_status]
refresh_interval = 10        # 自动刷新间隔（秒）；可被单台服务器覆盖
show_address = true
# api = "https://api.mcstatus.io/v2/status/java"   # 可选，覆盖默认状态 API

[[server_status.servers]]
name = "国内服 🇨🇳"
host = "mc.fantuantim.xyz"
port = 25565
# 基岩版与 Java 版互通、同主机不同端口：配了 bedrock_port 后卡片才显示「基岩版」地址胶囊
bedrock_port = 19132
note = "由群内小伙伴提供机器，解决国内用户访问海外服时容易掉线的问题。"
links = [
  { label = "QQ玩家群",   url = "https://qm.qq.com/q/l78SLY5eow" },
  { label = "QQ管理群",   url = "https://qm.qq.com/q/jK94lqgub0" },
  { label = "QQ交流频道", url = "https://pd.qq.com/s/9zuis6m4v" },
]

[[server_status.servers]]
name = "海外服 🏖️"
host = "paper.jokerhub.cn"
port = 25565
# 基岩版与 Java 版互通、同主机不同端口
bedrock_port = 19132
note = "离开 3 分钟后自动停止，白名单玩家加入时自动启动。与国内服是物理隔离的。"
# 可选 per-server 覆盖：show_address = true
links = [
  { label = "QQ玩家管理群",    url = "https://qm.qq.com/q/jIZ4hf4mYM" },
  { label = "Discord交流频道", url = "https://discord.gg/9JAb9vpvUE" },
]

