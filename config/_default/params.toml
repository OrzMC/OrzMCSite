# Ananke 主题Wiki： https://github.com/theNewDynamic/gohugo-theme-ananke/wiki
# CSS 配置参考：https://tachyons.io/

favicon = "/images/favicon.png"
# 默认社交分享图（og:image / twitter:image / Article 结构化数据）
default_og_image = "/images/og-default.png"
site_logo = ""
description = "Minecraft 服务器与玩法指南、更新记录与社区动态"
# 搜索引擎站长验证（GSC / Bing Webmaster 选「HTML 标记」验证后，把 content 值填在下面并重新发布）
google_site_verification = ""
bing_site_verification = ""
author = "Joker"
# site-header 是否在 hero 图/黑底区叠加页面标题与描述；默认 false（页面标题由正文内容区承担，避免双标题）
# 页面 frontmatter 可逐页覆盖为 true（如首页）；真时正文标题自动降级 h2 防同页双 h1
hero_title = false
body_classes = "avenir bg-near-white"
text_color = "black"
# 列表/归档日期显示格式（文章页头用 ISO 日期，二者保持一致的中文站习惯）
date_format = "2006-01-02"

featured_image_class = "cover bg-top"
cover_dimming_class = "bg-black-15"
background_color_class = "bg-black"

read_more_copy = "阅读全文"
recent_posts_number = 10
mainSections = ["posts"]

[ananke]
show_recent_posts = true
# 代码块显示「Copy」一键复制按钮（主题 render-codeblock 钩子，需 JS；见 site-scripts.html）
copy_code = true
custom_css = ["custom.css", "server-status.css"]

