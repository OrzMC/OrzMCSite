# 服务器实时状态组件（通用可嵌入：任意 markdown 里用 {{< server-status >}}）
# 说明：地址会写入页面配置 JSON 供浏览器查询状态 API；
# show_address 控制地址是否在卡片上显示（缺省 false；可被单台服务器覆盖）：
#   false：地址彻底隐藏——不渲染任何地址胶囊（无掩码/复制/眼睛），适合私密服；
#   true：显示地址胶囊（掩码 + 眼睛切换 + 复制按钮）。明文只在 JS 运行时解码，构建产物仍无明文。
[server_status]
refresh_interval = 10        # 自动刷新间隔（秒）；可被单台服务器覆盖
show_address = true
# 多服务器共用一块展示区域：true = 上方 Tab 切换（只显示选中的一张卡，Tab 带在线状态色点），
# false = 卡片纵向/双列排列。可被 shortcode 参数 tabs="true|false" 逐实例覆盖
# （仅服务器数 > 1 时生效，首页就是「主服 + 测试服」两个 Tab）。
tabs = false
# api = "https://api.mcstatus.io/v2/status/java"   # 可选，覆盖默认状态 API
# 「在浏览器中玩」按钮（紧跟在卡片上的 Web 地址胶囊下方）：**只要该服配了 Web 地址就显示**，不看 show_address
# （它是「能不能用浏览器玩」的能力开关；地址隐藏的服同样会出现）。
# 点击 = 新标签打开该客户端页 + 把本服 wss 地址写入剪贴板（到客户端「多人游戏 → 直连」粘贴）；
# 按钮下方常驻一行小字提示「点击会自动复制本服连接地址」，避免新标签打开后用户不知道地址已复制。
# 置空则不显示该按钮；换客户端版本时改这里的 URL 即可。
web_client_url = "https://eaglercraft.com/play?version=26.3"

# 每台服务器可配置三种客户端连接地址（卡片上各占一枚地址胶囊，未配置的客户端不渲染）：
#   Java 版（host + port，必填）——「Java版客户端连接地址」
#   基岩版（bedrock_port / bedrock_host）——「基岩版客户端连接地址」
#   Web 版（web_port / web_host）——「Web客户端连接地址」，浏览器客户端（Eaglercraft）
#     只接受 TLS 直连，卡片上显示为 wss://<主机>:<端口>（端口与 Java/基岩一致，一律显式、不带结尾斜杠），
#     可直接复制粘贴进 Web 客户端。
#     · web_host 缺省 = 与服务器（Java 主机）同一地址；也可填不同的 Web 客户端访问地址
#       （如独立子域 play.example.com），只写主机名，不要带 wss:// 前缀或结尾斜杠。
#     · web_port 缺省 443；443 不可用时走 18443（与 mcs./easybot. 同一 TLS 入口端口）。
#     服务端侧启用方式见 deploy 的 docs/eaglercraft-deploy.md。

[[server_status.servers]]
name = "国内服 🇨🇳"
host = "mc.fantuantim.xyz"
port = 25565
tags = ["cn"]
# 基岩版与 Java 版互通、同主机不同端口：配了 bedrock_port 后卡片才显示「基岩版」地址胶囊
bedrock_port = 19132
# Web 客户端（Eaglercraft）入口：**该服目前尚未适配**，适配后（服务端启用 EAGLER + TLS 反代）再填。
# web_port 不写 = 443（=> wss://mc.fantuantim.xyz:443）；443 不可用时改走 18443。
# web_host 不写 = 沿用 Java 主机；要指到不同的 Web 访问地址时填主机名（如独立子域）。
# web_port = 18443                         # => wss://mc.fantuantim.xyz:18443
# web_host = "play.fantuantim.xyz"         # => wss://play.fantuantim.xyz:443（缺省端口 443）
note = "由群内小伙伴提供机器，解决国内用户访问海外服时容易掉线的问题。"
links = [
  { label = "QQ玩家群",   url = "https://qm.qq.com/q/l78SLY5eow" },
  { label = "QQ管理群",   url = "https://qm.qq.com/q/jK94lqgub0" },
  { label = "QQ交流频道", url = "https://pd.qq.com/s/9zuis6m4v" },
]

