# Site
baseURL = "https://orzmc.jokerhub.cn"
title = "🇨🇳 OrzMC"
theme = "ananke"
defaultContentLanguage = "zh-cn"
enableRobotsTXT = true
hasCJKLanguage = true
enableGitInfo = true

[outputs]
home = ["HTML", "RSS"]
# 归档页 /posts/ 生成 HTML：利于爬虫发现与面包屑结构化数据（主页仍列出全部文章）
section = ["HTML", "RSS"]

# 相关文章（驱动 single.html 的「相关文章」模块）
[related]
threshold = 80
includeNewer = true
toLower = false
[[related.indices]]
name = "tags"
weight = 100
[[related.indices]]
name = "categories"
weight = 80

[minify]
minifyOutput = true

# Hugo
[module.hugoVersion]
min = "0.164.0"

[markup.highlight]
style = "dracula"
lineNumbers = true
lineNumbersInTable = true
guessSyntax = true
noClasses = true
tabWidth = 4

[sitemap]
changefreq = "weekly"
priority = 0.5
