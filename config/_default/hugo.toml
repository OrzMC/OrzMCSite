# Site
baseURL = "https://orzmc.jokerhub.cn"
title = "🇨🇳 OrzMC"
theme = "ananke"
defaultContentLanguage = "zh-cn"
enableRobotsTXT = true
hasCJKLanguage = true

[outputs]
home = ["HTML", "RSS"]
# section 只出 RSS 不出 HTML：主页已列出全部文章，归档页 /posts/ 不再需要页面
section = ["RSS"]



# Hugo
[module.hugoVersion]
min = "0.164.0"

[markup.highlight]
style = "dracula"
lineNumbers = true
lineNumbersInTable = true
guessSyntax = true
noClasses = true
tabWidth = 4

[sitemap]
changefreq = "weekly"
priority = 0.5
